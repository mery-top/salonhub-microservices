spring:
  application:
    name: gateway-server
    
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: USER-SERVICE
          uri:
            lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/api/admin/users/**,/api/users/**,/users/**

        - id: BOOKING-SERVICE
          uri:
            lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

        - id: PAYMENT-SERVICE
          uri:
            lb://PAYMENT-SERVICE
          predicates:
              - Path=/api/payments/**

        - id: CATEGORY-SERVICE
          uri:
            lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: SALON-SERVICE
          uri:
            lb://SALON-SERVICE
          predicates:
            - Path=/salons/**,/api/salons/**,/api/admin/salons/**

        - id: SERVICE-OFFERING
          uri:
            lb://SERVICE-OFFERING
          predicates:
            - Path=/api/service-offering/**

        - id: REVIEW-SERVICE
          uri:
            lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**

        - id: NOTIFICATION-SERVICE
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: AI-SERVICE
          uri:
            lb://AI-SERVICE
          predicates:
            - Path=/api/hair/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"




server:
  port: 5007




eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://eurekaserver:8070/eureka/"