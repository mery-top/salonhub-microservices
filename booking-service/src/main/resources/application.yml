spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/bookingdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 5005


eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"