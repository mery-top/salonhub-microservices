server:
  port: 5009

spring:
  application:
    name: review-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:reviewdb}:3306/reviewdb?createDatabaseIfNotExist=true
    username: root
    password: root

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    service-url:
      defaultZone: "http://eurekaserver:8070/eureka/"