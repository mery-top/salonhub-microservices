server:
  port: 5010

spring:
  application:
    name: ai-service

  ai:
    ollama:
      base-url: http://ollama:11434
      chat:
        options:
          model: gemma:2b

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:hairstyledb}:3306/hairstyledb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  codec:
    max-in-memory-size: 10MB

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    service-url:
      defaultZone: "http://eurekaserver:8070/eureka/"