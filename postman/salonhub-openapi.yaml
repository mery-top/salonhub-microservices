openapi: 3.0.3
info:
  title: SalonHub API
  version: 1.0.0
  description: OpenAPI specification for the SalonHub microservices platform

servers:
  - url: http://localhost:5007
    description: API Gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserCreate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        username:
          type: string
        role:
          type: string
          example: ROLE_CUSTOMER

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          type: string
          example: ROLE_CUSTOMER

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    SalonCreate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        openTime:
          type: string
        closeTime:
          type: string
        images:
          type: array
          items:
            type: string

    SalonUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        openTime:
          type: string
        closeTime:
          type: string

    CategoryCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ServiceOfferingCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        duration:
          type: integer
        categoryId:
          type: integer

    BookingCreate:
      type: object
      properties:
        serviceIds:
          type: array
          items:
            type: integer
        startTime:
          type: string
        bookingDate:
          type: string

    PaymentCreate:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        salonId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
        startTime:
          type: string
        endTime:
          type: string
        bookingDate:
          type: string
        status:
          type: string
        totalPrice:
          type: number

    ReviewCreate:
      type: object
      properties:
        reviewText:
          type: string
        rating:
          type: integer

    NotificationCreate:
      type: object
      properties:
        userId:
          type: integer
        salonId:
          type: integer
        bookingId:
          type: integer
        message:
          type: string

tags:
  - name: Users
    description: User management endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Salons
    description: Salon management endpoints
  - name: Categories
    description: Category management endpoints
  - name: Service Offerings
    description: Service offering endpoints
  - name: Bookings
    description: Booking management endpoints
  - name: Payments
    description: Payment processing endpoints
  - name: Reviews
    description: Review management endpoints
  - name: Notifications
    description: Notification endpoints
  - name: AI
    description: AI-powered endpoints

paths:

  # ─── Users ───────────────────────────────────────────────────────────────────

  /api/users:
    get:
      tags:
        - Users
      summary: Get All Users
      responses:
        '200':
          description: OK
    post:
      tags:
        - Users
      summary: Create User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: OK

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get User by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      tags:
        - Users
      summary: Update User
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      tags:
        - Users
      summary: Delete User by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  /api/users/profile:
    get:
      tags:
        - Users
      summary: Get User Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  # ─── Auth ─────────────────────────────────────────────────────────────────────

  /auth/signup:
    post:
      tags:
        - Auth
      summary: Sign Up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: OK

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /auth/access-token/refresh-token/{refreshToken}:
    get:
      tags:
        - Auth
      summary: Get Access Token from Refresh Token
      parameters:
        - name: refreshToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  # ─── Salons ───────────────────────────────────────────────────────────────────

  /api/salons:
    post:
      tags:
        - Salons
      summary: Create Salon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalonCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
    get:
      tags:
        - Salons
      summary: Get All Salons
      responses:
        '200':
          description: OK

  /api/salons/{salonId}:
    get:
      tags:
        - Salons
      summary: Get Salon by ID
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/salons/search:
    get:
      tags:
        - Salons
      summary: Search Salons by City
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /api/salons/{id}:
    patch:
      tags:
        - Salons
      summary: Update Salon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalonUpdate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  /api/salons/owner:
    get:
      tags:
        - Salons
      summary: Get Salon by Owner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  # ─── Categories ───────────────────────────────────────────────────────────────

  /api/categories/salon-owner:
    post:
      tags:
        - Categories
      summary: Create Category (Salon Owner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/categories/salon/{id}:
    get:
      tags:
        - Categories
      summary: Get Categories by Salon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get Category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/categories/salon-owner/{id}:
    delete:
      tags:
        - Categories
      summary: Delete Category (Salon Owner)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  # ─── Service Offerings ────────────────────────────────────────────────────────

  /api/service-offering/list/{ids}:
    get:
      tags:
        - Service Offerings
      summary: Get Services by IDs (List)
      parameters:
        - name: ids
          in: path
          required: true
          description: Comma-separated list of service IDs
          schema:
            type: string
      responses:
        '200':
          description: OK

  /api/service-offering/salon/{salonId}:
    get:
      tags:
        - Service Offerings
      summary: Get Services by Salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/service-offering/{id}:
    get:
      tags:
        - Service Offerings
      summary: Get Service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/service-offering/salon-owner:
    post:
      tags:
        - Service Offerings
      summary: Create Service Offering
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOfferingCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/service-offering/salon-owner/{serviceId}:
    post:
      tags:
        - Service Offerings
      summary: Update Service Offering
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOfferingCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  # ─── Bookings ─────────────────────────────────────────────────────────────────

  /api/bookings:
    post:
      tags:
        - Bookings
      summary: Create Booking
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: query
          required: true
          schema:
            type: integer
        - name: paymentMethod
          in: query
          required: true
          schema:
            type: string
            example: RAZORPAY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/bookings/customer:
    get:
      tags:
        - Bookings
      summary: Get Customer Bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/bookings/salon:
    get:
      tags:
        - Bookings
      summary: Get Salon Bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/bookings/{bookingId}:
    get:
      tags:
        - Bookings
      summary: Get Booking by ID
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/bookings/{bookingId}/status:
    put:
      tags:
        - Bookings
      summary: Update Booking Status
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: string
            example: CONFIRMED
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/bookings/report:
    get:
      tags:
        - Bookings
      summary: Get Booking Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/bookings/chart/earnings:
    get:
      tags:
        - Bookings
      summary: Get Earnings Chart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/bookings/chart/bookings:
    get:
      tags:
        - Bookings
      summary: Get Bookings Chart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  # ─── Payments ─────────────────────────────────────────────────────────────────

  /api/payments/create:
    post:
      tags:
        - Payments
      summary: Create Payment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentMethod
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/payments/{paymentOrderId}:
    get:
      tags:
        - Payments
      summary: Get Payment Order by ID
      parameters:
        - name: paymentOrderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/payments/proceed:
    patch:
      tags:
        - Payments
      summary: Proceed Payment
      parameters:
        - name: paymentId
          in: query
          required: true
          schema:
            type: string
        - name: paymentLinkId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  # ─── Reviews ──────────────────────────────────────────────────────────────────

  /api/reviews/salon/{salonId}:
    post:
      tags:
        - Reviews
      summary: Create Review for Salon
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
    get:
      tags:
        - Reviews
      summary: Get Reviews by Salon
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  /api/reviews/{reviewId}:
    put:
      tags:
        - Reviews
      summary: Update Review
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      tags:
        - Reviews
      summary: Delete Review
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

  # ─── Notifications ────────────────────────────────────────────────────────────

  /api/notifications:
    post:
      tags:
        - Notifications
      summary: Create Notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        '200':
          description: OK

  /api/notifications/user/{userId}:
    get:
      tags:
        - Notifications
      summary: Get Notifications by User ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/notifications/{notificationId}/read:
    put:
      tags:
        - Notifications
      summary: Mark Notification as Read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  /api/notifications/salon-owner/salon/{salonId}:
    get:
      tags:
        - Notifications
      summary: Get Salon Owner Notifications
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

  # ─── AI ───────────────────────────────────────────────────────────────────────

  /api/hair/analyze:
    post:
      tags:
        - AI
      summary: Analyze Hair Style
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
